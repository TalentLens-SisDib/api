services:
  api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_data:/app/data
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: file:/app/data/dev.db
    command: sh -c "npm install && npm run start:dev"

volumes:
  api_node_modules:
  api_data:
