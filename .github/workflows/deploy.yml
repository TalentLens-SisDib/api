name: Build and deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/talentlens-sisdib/api:main
            ghcr.io/talentlens-sisdib/api:${{ github.sha }}

  redeploy:
    needs: build
    runs-on: [self-hosted, talentlens]
    permissions: {}
    steps:
      - name: Pull latest stack and images
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_CONNECT_IP: ${{ secrets.PORTAINER_CONNECT_IP }}
          PORTAINER_CA_CERT: ${{ secrets.PORTAINER_CA_CERT }}
        shell: python3 {0}
        run: |
          import http.client
          import json
          import os
          import socket
          import ssl
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["PORTAINER_URL"])
          if url.scheme != "https" or not url.hostname:
              raise ValueError("PORTAINER_URL must be an HTTPS URL")
          tls = ssl.create_default_context(cadata=os.environ.get("PORTAINER_CA_CERT") or None)

          class PortainerConnection(http.client.HTTPSConnection):
              def connect(self):
                  raw = socket.create_connection((os.environ["PORTAINER_CONNECT_IP"], self.port), timeout=self.timeout)
                  self.sock = tls.wrap_socket(raw, server_hostname=self.host)

          def request(method, path, payload=None):
              connection = PortainerConnection(url.hostname, url.port or 443, context=tls, timeout=180)
              try:
                  connection.request(method, path, body=json.dumps(payload) if payload is not None else None,
                                     headers={"X-API-Key": os.environ["PORTAINER_API_KEY"], "Content-Type": "application/json"})
                  response = connection.getresponse()
                  data = response.read()
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f"Portainer returned HTTP {response.status} for {method} {path}")
                  return json.loads(data) if data else {}
              finally:
                  connection.close()

          stack_id = int(os.environ["PORTAINER_STACK_ID"])
          endpoint_id = int(os.environ["PORTAINER_ENDPOINT_ID"])
          stack = request("GET", f"/api/stacks/{stack_id}")
          request("PUT", f"/api/stacks/{stack_id}/git/redeploy?endpointId={endpoint_id}",
                  {"RepullImageAndRedeploy": True, "Env": stack.get("Env", []),
                   "RepositoryReferenceName": "refs/heads/main"})
          print("Portainer stack redeployed successfully with verified HTTPS")
